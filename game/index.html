<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cube Rooftops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed WebGL canvas; HUD pinned to the top corners; prompts centered over a dimmed scene. */
:root {
  --bg: #0f161d;
  --ink: #eef2f5;
  --ink-dim: rgba(238, 242, 245, 0.62);
  --panel: rgba(14, 20, 28, 0.6);
  --line: rgba(238, 242, 245, 0.2);
  --hp: #47d68a;
  --hp-low: #ff4b4b;
  --focus: #7cc4ff;
  --enemy: #ff5a4f;
  --player: #3f8cff;
  --font-hud: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-hud); }
canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; transition: filter .25s ease; }
body.slowmo canvas { filter: saturate(.55) contrast(1.08); }

.panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; backdrop-filter: blur(4px); user-select: none; }
.label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.num { font-variant-numeric: tabular-nums; font-weight: 700; }

#vitals { top: calc(env(safe-area-inset-top, 0px) + 16px); left: max(16px, env(safe-area-inset-left, 0px)); width: 240px; display: grid; gap: 6px; }
#vitals .row { display: flex; justify-content: space-between; align-items: baseline; }
#hpText { font-size: 22px; line-height: 1; }
.bar { height: 14px; background: rgba(255, 255, 255, .12); border-radius: 3px; overflow: hidden; }
.bar.thin { height: 6px; }
.fill { height: 100%; width: 100%; transition: width .15s ease-out, background-color .2s; }
.fill.hp { background: var(--hp); }
.fill.focus { background: var(--focus); }
#vitals.low .fill.hp { background: var(--hp-low); }
#vitals.low #hpText { color: var(--hp-low); }
#vitals.hit { animation: jolt .28s ease-out; }
@keyframes jolt { 0% { transform: translate(0, 0); } 25% { transform: translate(-5px, 2px); } 50% { transform: translate(4px, -2px); } 75% { transform: translate(-2px, 1px); } 100% { transform: translate(0, 0); } }

#targets { top: calc(env(safe-area-inset-top, 0px) + 16px); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; align-items: baseline; }
#enemyCount { font-size: 22px; color: var(--enemy); }

#crosshair { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%); pointer-events: none; }
#crosshair::before, #crosshair::after { content: ""; position: absolute; background: var(--ink); box-shadow: 0 0 2px rgba(0,0,0,.8); }
#crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%, 0 65%, 100% 65%, 100% 100%, 0 100%); }
#crosshair::after { top: 10px; left: 0; height: 2px; width: 22px; clip-path: polygon(0 0, 35% 0, 35% 100%, 0 100%, 0 0, 65% 0, 100% 0, 100% 100%, 65% 100%); }
#crosshair.hitmark::before, #crosshair.hitmark::after { background: var(--enemy); }

#moveTag { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; padding: 4px 10px; border-radius: 3px; background: var(--panel); border: 1px solid var(--line); opacity: 0; transition: opacity .15s; pointer-events: none; }
#moveTag.on { opacity: 1; }

#hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(200, 0, 0, 0) 42%, rgba(200, 0, 0, .55) 78%, rgba(150, 0, 0, .9) 100%); }
#slow { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s; background: radial-gradient(ellipse at center, rgba(70, 150, 255, 0) 50%, rgba(70, 150, 255, .32) 100%); }
body.slowmo #slow { opacity: 1; }

#overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: rgba(8, 12, 18, .55); backdrop-filter: blur(3px); }
#overlay.passive { pointer-events: none; background: radial-gradient(ellipse at center, rgba(8, 12, 18, .7) 0%, rgba(8, 12, 18, .35) 70%); backdrop-filter: none; }
#overlay.passive .card { text-shadow: 0 2px 10px rgba(0, 0, 0, .7); }
#overlay.clickable { cursor: pointer; }
.card { max-width: 600px; width: 100%; display: grid; gap: 14px; text-align: left; animation: rise .35s ease-out; }
@keyframes rise { from { transform: translateY(10px); opacity: .0; } to { transform: none; opacity: 1; } }
.card h1 { margin: 0; font-size: clamp(30px, 6vw, 52px); line-height: 1; letter-spacing: .03em; text-transform: uppercase; text-wrap: balance; }
.card h1 .b { color: var(--player); }
.card h1 .r { color: var(--enemy); }
.card p { margin: 0; color: var(--ink-dim); font-size: 16px; line-height: 1.45; max-width: 60ch; }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px 22px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.controls div { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.controls span:first-child { color: var(--ink-dim); }
.key { display: inline-block; border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 4px; padding: 1px 8px; font-weight: 700; font-size: 13px; color: var(--ink); background: rgba(255,255,255,.06); }
.cta { font-size: 18px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.cta .key { font-size: 18px; padding: 2px 12px; }
.dead h1 { color: var(--hp-low); }
.won h1 { color: var(--hp); }
.note { font-size: 13px; color: var(--ink-dim); }
@media (prefers-reduced-motion: reduce) { .card, #vitals.hit { animation: none; } }
</style>
</head>
<body>
<div id="vitals" class="panel">
  <div class="row"><span class="label">Health</span><span id="hpText" class="num">100</span></div>
  <div class="bar"><div id="hpFill" class="fill hp"></div></div>
  <div class="row"><span class="label">Bullet time</span><span class="label">RMB / E</span></div>
  <div class="bar thin"><div id="focusFill" class="fill focus"></div></div>
</div>
<div id="targets" class="panel"><span class="label">Enemies left</span><span id="enemyCount" class="num">9</span></div>
<div id="crosshair"></div>
<div id="moveTag"></div>
<div id="slow"></div>
<div id="hurt"></div>
<div id="overlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const V3 = THREE.Vector3;
const $ = (id) => document.getElementById(id);

// ------------------------------------------------------------------ tuning
const CFG = {
  gravity: 28, maxFall: 32,
  walkSpeed: 6, runSpeed: 11,
  groundAccel: 70, airAccel: 16,
  jumpVel: 10, coyote: 0.1, jumpBuffer: 0.14,
  stepUp: 0.6,
  wallRunTime: 1.3, wallRunMinSpeed: 3.5, wallRunGravity: 7,
  wallClimbTime: 0.4, wallClimbSpeed: 7.5,
  wallJumpOut: 8.5, wallJumpUp: 9.8,
  playerHP: 100, enemyHP: 75,
  playerBulletSpeed: 95, playerDamage: 25, playerFireCooldown: 0.13,
  enemyBulletSpeed: 42, enemyDamage: 12, enemyRange: 95,
  enemyBurst: 3, enemyBurstGap: 0.13, enemyBurstDelay: 1.3,   // 3-round bursts, ~1.3-1.8 s apart
  bulletTimeScale: 0.25, focusMax: 100, focusDrain: 24, focusRegen: 12, focusRegenDelay: 1.0,
  mouseSens: 0.0022,
};
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ------------------------------------------------------------------ level data
// Every solid thing is an axis-aligned box. Units are roughly metres; a character cube is 1 m.
const boxes = [];
function addBox(x0, y0, z0, x1, y1, z1, kind, tint = 0) {
  const b = {
    min: { x: Math.min(x0, x1), y: Math.min(y0, y1), z: Math.min(z0, z1) },
    max: { x: Math.max(x0, x1), y: Math.max(y0, y1), z: Math.max(z0, z1) },
    kind, tint,
  };
  boxes.push(b);
  return b;
}
function block(cx, cz, w, d, h, y0, kind, tint) { return addBox(cx - w / 2, y0, cz - d / 2, cx + w / 2, y0 + h, cz + d / 2, kind, tint); }
// A slab sticking out of a wall, `top` metres up, `t` thick.
function ledge(x0, z0, x1, z1, top, t = 0.6) { return addBox(x0, top - t, z0, x1, top, z1, 'ledge'); }

function buildLevel() {
  addBox(-60, -1, -60, 60, 0, 60, 'ground');
  addBox(-60, 0, -61, 60, 8, -60, 'boundary'); addBox(-60, 0, 60, 60, 8, 61, 'boundary');
  addBox(-61, 0, -60, -60, 8, 60, 'boundary'); addBox(60, 0, -60, 61, 8, 60, 'boundary');

  // Buildings
  block(-20, 0, 12, 14, 8, 0, 'building', 0);     // W1  roof 8
  block(-22, -20, 14, 12, 16, 0, 'building', 1);  // W2  roof 16
  block(0, -30, 16, 16, 24, 0, 'building', 2);    // N1  roof 24 (highest)
  block(20, -5, 10, 18, 12, 0, 'building', 3);    // E1  roof 12
  block(22, 18, 10, 10, 5, 0, 'building', 4);     // E2  roof 5

  // No stairs: every roof is reached by platforming. Orange pieces mark the routes.
  // A standing jump clears ~1.7 m; a jump into a wall followed by a climb gains ~4 m.

  // West route: ground -> pillars -> balcony -> climb W1 (8) -> tank -> pillar -> balcony -> climb W2 (16)
  //             -> rooftop tank -> two pillars -> climb N1 (24)
  block(-10.5, 19.5, 2.5, 2.5, 1.2, 0, 'route');
  block(-13.5, 16.5, 2.5, 2.5, 2.4, 0, 'route');
  block(-16.5, 13, 2.5, 2.5, 3.6, 0, 'route');
  ledge(-20, 7, -15, 10, 4.5);                       // balcony on W1's south face
  block(-22, -5.5, 3, 3, 3, 8, 'route');             // water tank on W1 roof (climb it)
  block(-22, -10.5, 2, 2, 11.5, 0, 'route');         // pillar in the gap
  ledge(-24, -14, -20, -12, 12.5);                   // balcony on W2's south face
  block(-17, -24, 3, 3, 3, 16, 'route');             // tank on W2 roof (climb it)
  block(-12.5, -24, 2, 2, 20, 0, 'route');
  block(-9.75, -24, 1.5, 1.5, 21, 0, 'route');       // last pillar, then climb N1's west face

  // East route: ground -> crates -> climb E2 (5) -> AC unit -> two pillars -> climb E1 (12)
  block(12, 21, 2.5, 2.5, 1.3, 0, 'route');
  block(15.25, 19, 2, 2, 2.4, 0, 'route');
  block(22, 14.5, 3, 2, 1.3, 5, 'route');            // AC unit on E2 roof
  block(22, 10, 2, 2, 7.5, 0, 'route');
  block(22, 6.5, 2, 2, 8.7, 0, 'route');

  // Parkour: a 3 m chimney between N1's south face and a free-standing wall (wall-jump up it),
  // and a long wall on the west side for wall running.
  addBox(-6, 0, -19, 6, 22, -18, 'wall');
  addBox(-36, 0, -32, -35, 10, 22, 'wall');

  // Street-level cover
  block(0, 12, 3, 3, 2, 0, 'crate');
  block(-7, 22, 2.5, 4, 1.5, 0, 'crate');
  block(9, 27, 4, 2.5, 2.5, 0, 'crate');
  block(5, 2, 2, 2, 3.5, 0, 'crate');
  block(-4, -6, 3, 3, 1.5, 0, 'crate');
  block(12, -16, 2, 6, 3, 0, 'crate');
  block(-12, 30, 3, 3, 3, 0, 'crate');
  block(30, 30, 3, 3, 1.5, 0, 'crate');
  block(-30, 36, 4, 2, 2, 0, 'crate');

  // Rooftop cover
  block(-4, -33, 3, 1, 1.4, 24, 'cover');
  block(3, -26, 1, 3, 1.4, 24, 'cover');
  block(19, -4, 1, 4, 1.4, 12, 'cover');
  block(-24, -19, 1, 3, 1.4, 16, 'cover');
  block(-18, 2, 2, 2, 1.4, 8, 'cover');
  block(19.5, 14.5, 1.5, 1.5, 1.2, 5, 'cover');
}

// Enemy placement is fixed, so every restart starts from the same layout.
const ENEMY_SPAWNS = [
  { x: -17,   y: 8,  z: -3,  bounds: [-26, -14, -7, 7] },
  { x: -15.5, y: 8,  z: 4,   bounds: [-26, -14, -7, 7] },
  { x: -20,   y: 16, z: -18, bounds: [-29, -15, -26, -14] },
  { x: -26,   y: 16, z: -16, bounds: [-29, -15, -26, -14] },
  { x: -2,    y: 24, z: -28, bounds: [-8, 8, -38, -22] },
  { x: 4,     y: 24, z: -34, bounds: [-8, 8, -38, -22] },
  { x: 20,    y: 12, z: -10, bounds: [15, 25, -14, 4] },
  { x: 18,    y: 12, z: 1,   bounds: [15, 25, -14, 4] },
  { x: 19.5,  y: 5,  z: 17.5, bounds: [17, 27, 13, 23] },
];
const PLAYER_SPAWN = { x: 0, y: 0.5, z: 36 };

// ------------------------------------------------------------------ renderer & scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
const SKY = 0xa9c7dc;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 70, 190);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 400);
scene.add(new THREE.HemisphereLight(0xe4f0ff, 0x4f5961, 0.75));
const sun = new THREE.DirectionalLight(0xfff1dd, 0.95);
sun.position.set(40, 80, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -72, right: 72, top: 72, bottom: -72, near: 10, far: 220 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun);

function makeWindowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#f3f2ee'; g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#dedcd5'; g.fillRect(0, 120, 128, 8);            // floor slab
  const grd = g.createLinearGradient(0, 26, 0, 96);
  grd.addColorStop(0, '#8aa0b3'); grd.addColorStop(1, '#4a5a6a');
  g.fillStyle = grd; g.fillRect(28, 26, 72, 70);                   // window
  g.fillStyle = 'rgba(255,255,255,.22)'; g.fillRect(28, 26, 72, 5);
  g.fillStyle = '#d6d4cd'; g.fillRect(62, 26, 4, 70);              // mullion
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
function makeBlobTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(32, 32, 17, 0, Math.PI * 2); g.fill();
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2 + i * 0.7, r = 18 + (i % 3) * 5;
    g.beginPath(); g.arc(32 + Math.cos(a) * r, 32 + Math.sin(a) * r, 2 + (i % 4), 0, Math.PI * 2); g.fill();
  }
  return new THREE.CanvasTexture(c);
}
const windowTex = makeWindowTexture();
const blobTex = makeBlobTexture();

const BUILDING_TINTS = ['#ddd6ca', '#c8d0d8', '#d9cfc2', '#c2cbd3', '#d3d9d2'];
const KIND_COLORS = { ground: '#7c857e', boundary: '#9097a0', route: '#d98a3d', ledge: '#c97c34', wall: '#a8a197', crate: '#8e8b84', cover: '#7f878f' };
const edgeMat = new THREE.LineBasicMaterial({ color: 0x252b31, transparent: true, opacity: 0.35 });
const matCache = {};
function materialFor(b) {
  if (b.kind === 'building') {
    const key = 'b' + b.tint;
    if (!matCache[key]) {
      const side = new THREE.MeshLambertMaterial({ color: BUILDING_TINTS[b.tint], map: windowTex });
      const roof = new THREE.MeshLambertMaterial({ color: new THREE.Color(BUILDING_TINTS[b.tint]).multiplyScalar(0.66) });
      matCache[key] = [side, side, roof, roof, side, side];
    }
    return matCache[key];
  }
  if (!matCache[b.kind]) matCache[b.kind] = new THREE.MeshLambertMaterial({ color: KIND_COLORS[b.kind] || '#999' });
  return matCache[b.kind];
}
// Scale UVs so the window texture tiles every 3 m (one storey) regardless of box size.
function tileUVs(geo, w, h, d, tile) {
  const uv = geo.attributes.uv, dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) for (let v = 0; v < 4; v++) {
    const i = f * 4 + v;
    uv.setXY(i, uv.getX(i) * dims[f][0] / tile, uv.getY(i) * dims[f][1] / tile);
  }
  uv.needsUpdate = true;
}
function addBoxMesh(b, collide = true) {
  const w = b.max.x - b.min.x, h = b.max.y - b.min.y, d = b.max.z - b.min.z;
  const geo = new THREE.BoxGeometry(w, h, d);
  if (b.kind === 'building') tileUVs(geo, w, h, d, 3);
  const mesh = new THREE.Mesh(geo, materialFor(b));
  mesh.position.set((b.min.x + b.max.x) / 2, (b.min.y + b.max.y) / 2, (b.min.z + b.max.z) / 2);
  mesh.castShadow = b.kind !== 'ground';
  mesh.receiveShadow = true;
  if (b.kind !== 'ground') mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat));
  scene.add(mesh);
  return mesh;
}

buildLevel();
boxes.forEach((b) => addBoxMesh(b));
const grid = new THREE.GridHelper(120, 60, 0x3b433d, 0x3b433d);
grid.position.y = 0.01; grid.material.transparent = true; grid.material.opacity = 0.18;
scene.add(grid);
// Skyline outside the arena (visual only, not collidable).
[[-80, -70, 18, 18, 40, 1], [-50, -85, 22, 14, 55, 3], [-5, -88, 26, 16, 70, 0], [40, -82, 18, 18, 46, 2], [78, -55, 16, 24, 38, 4],
 [85, 10, 18, 18, 30, 1], [80, 60, 20, 16, 50, 3], [-85, 20, 16, 22, 34, 2], [-80, 70, 22, 18, 44, 0], [20, 85, 26, 14, 36, 4]]
  .forEach(([x, z, w, d, h, t]) => addBoxMesh({ min: { x: x - w / 2, y: 0, z: z - d / 2 }, max: { x: x + w / 2, y: h, z: z + d / 2 }, kind: 'building', tint: t }));
{
  const far = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshLambertMaterial({ color: '#6c746e' }));
  far.rotation.x = -Math.PI / 2; far.position.y = -0.02; scene.add(far);
}

// ------------------------------------------------------------------ shared geometry & materials
const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
const visorGeo = new THREE.BoxGeometry(0.72, 0.16, 0.04);
const visorMat = new THREE.MeshBasicMaterial({ color: 0x12161b });
const gunGeo = new THREE.BoxGeometry(0.13, 0.13, 0.75); gunGeo.translate(0, 0, -0.37);
const gunMat = new THREE.MeshLambertMaterial({ color: 0x23282e });
const chunkGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
const pBulletGeo = new THREE.BoxGeometry(0.07, 0.07, 1.4);
const pBulletMat = new THREE.MeshBasicMaterial({ color: 0xffe27a });
const eBulletGeo = new THREE.BoxGeometry(0.16, 0.16, 1.0);
const eBulletMat = new THREE.MeshBasicMaterial({ color: 0xff5a1f });
const particleGeo = new THREE.BoxGeometry(1, 1, 1);
const bloodMat = new THREE.MeshBasicMaterial({ color: 0xa00812 });
const sparkMat = new THREE.MeshBasicMaterial({ color: 0xffd38a });
const decalGeo = new THREE.PlaneGeometry(1, 1);
const bloodDecalMat = new THREE.MeshLambertMaterial({ map: blobTex, color: 0x6e0a0a, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 });
const holeDecalMat = new THREE.MeshLambertMaterial({ map: blobTex, color: 0x262626, transparent: true, opacity: 0.85, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 });
const barBgGeo = new THREE.PlaneGeometry(1.2, 0.16);
const barFillGeo = new THREE.PlaneGeometry(1.14, 0.1); barFillGeo.translate(0.57, 0, 0);
const barBgMat = new THREE.MeshBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.65, depthWrite: false });
const barFillMat = new THREE.MeshBasicMaterial({ color: 0xff4a3d, depthWrite: false });
const muzzle = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.28, 0.28), new THREE.MeshBasicMaterial({ color: 0xfff3b0 }));
muzzle.visible = false; scene.add(muzzle);
const Z_AXIS = new V3(0, 0, 1);

function makeCube(color) {
  const mat = new THREE.MeshLambertMaterial({ color, emissive: 0x000000 });
  const mesh = new THREE.Mesh(cubeGeo, mat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  const visor = new THREE.Mesh(visorGeo, visorMat); visor.position.set(0, 0.17, -0.51); mesh.add(visor);
  const gun = new THREE.Mesh(gunGeo, gunMat); gun.position.set(0.57, -0.02, -0.05); gun.castShadow = true; mesh.add(gun);
  scene.add(mesh);
  return { mesh, mat, gun };
}

// ------------------------------------------------------------------ collision helpers
function overlapsBox(px, py, pz, hx, hy, hz, b) {
  return px + hx > b.min.x && px - hx < b.max.x && py + hy > b.min.y && py - hy < b.max.y && pz + hz > b.min.z && pz - hz < b.max.z;
}
function anyOverlap(px, py, pz, hx, hy, hz) {

function pointBox(p) {

// Slab test. d must be normalised; returns distance to entry (0 if inside) or Infinity.
function rayAABB(o, d, min, max) {

    let t1 = (min[a] - o[a]) / d[a], t2 = (max[a] - o[a]) / d[a];

function rayWorld(o, d, maxT) {

// Outward face normal of box b closest to point p (used to orient decals).
function faceNormal(p, b) {

    [p.x - b.min.x, -1, 0, 0], [b.max.x - p.x, 1, 0, 0],
    [p.y - b.min.y, 0, -1, 0], [b.max.y - p.y, 0, 1, 0],
    [p.z - b.min.z, 0, 0, -1], [b.max.z - p.z, 0, 0, 1],

  for (const e of c) if (Math.abs(e[0]) < Math.abs(best[0])) best = e;
  return new V3(best[1], best[2], best[3]);

// Moves an AABB body through the world one axis at a time, with sub-steps and step-up onto low ledges.
function moveBody(body, dt, stepUp) {
  const p = body.pos, v = body.vel, h = body.half;
  const res = { grounded: false, ceil: false, hitX: 0, hitZ: 0 };
  const maxD = Math.max(Math.abs(v.x), Math.abs(v.y), Math.abs(v.z)) * dt;
  const n = Math.max(1, Math.ceil(maxD / 0.25));
  const sdt = dt / n;
  const canStep = stepUp > 0 && body.grounded;
  for (let s = 0; s < n; s++) {
    for (const axis of ['x', 'z']) {
      const vel = v[axis];
      if (vel === 0) continue;
      p[axis] += vel * sdt;
      for (let i = 0; i < boxes.length; i++) {
        const b = boxes[i];
        if (!overlapsBox(p.x, p.y, p.z, h.x, h.y, h.z, b)) continue;
        const rise = b.max.y - (p.y - h.y);
        if (canStep && rise > 0 && rise <= stepUp && !anyOverlap(p.x, b.max.y + h.y + 0.002, p.z, h.x, h.y, h.z)) {
          p.y = b.max.y + h.y + 0.001;
          continue;
        }
        if (vel > 0) { p[axis] = b.min[axis] - h[axis] - 1e-4; if (axis === 'x') res.hitX = -1; else res.hitZ = -1; }
        else { p[axis] = b.max[axis] + h[axis] + 1e-4; if (axis === 'x') res.hitX = 1; else res.hitZ = 1; }
        v[axis] = 0;
        break;
      }
    }
    if (v.y !== 0) {
      p.y += v.y * sdt;
      for (let i = 0; i < boxes.length; i++) {
        const b = boxes[i];
        if (!overlapsBox(p.x, p.y, p.z, h.x, h.y, h.z, b)) continue;
        if (v.y < 0) { p.y = b.max.y + h.y + 1e-4; res.grounded = true; }
        else { p.y = b.min.y - h.y - 1e-4; res.ceil = true; }
        v.y = 0;
        break;
      }
    }
  }

}
// Returns the normal of a wall touching the body's side (pointing away from the wall), or null.
const PROBE_DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
function wallProbe(body, prefer) {
  const p = body.pos, h = body.half, e = 0.14;
  let found = null, bestScore = -2;
  for (const [dx, dz] of PROBE_DIRS) {
    if (anyOverlap(p.x + dx * e, p.y, p.z + dz * e, h.x, h.y * 0.6, h.z)) {
      const n = { x: -dx, z: -dz };
      const score = prefer ? -(prefer.x * n.x + prefer.z * n.z) : 0;
      if (score > bestScore) { bestScore = score; found = n; }
    }
  }
  return found;
}

// ------------------------------------------------------------------ game state
let state = 'start';            // start | playing | paused | dead | won
let fallbackAim = false, everLocked = false;
const keys = {};
let firing = false, jumpQueued = false;
let yaw = 0, pitch = -0.12;
let bulletTime = false, timeScale = 1, focus = CFG.focusMax, focusDelay = 0;
let hurt = 0, shake = 0, camRoll = 0, camPivotY = PLAYER_SPAWN.y;
let elapsed = 0, winTimer = -1, hitmarkT = 0, shotsFired = 0, shotsHit = 0;

const playerParts = makeCube(0x3f8cff);
const player = {
  pos: new V3(), vel: new V3(), half: { x: 0.5, y: 0.5, z: 0.5 }, grounded: false,
  hp: CFG.playerHP, alive: true, coyote: 0, jumpBuf: 0,
  wallState: 'none', wallTimer: 0, wallNormal: null, lastWallNormal: null, wallJumpLock: 0,
  fireCd: 0, flash: 0, ...playerParts,
};
let enemies = [];
const bullets = [], particles = [], decals = [], chunks = [];
const MAX_DECALS = 320, MAX_PARTICLES = 500;

function createEnemy(spec, i) {
  const parts = makeCube(0xe23b3b);
  const bar = new THREE.Group();
  const bg = new THREE.Mesh(barBgGeo, barBgMat);
  const fill = new THREE.Mesh(barFillGeo, barFillMat); fill.position.set(-0.57, 0, 0.002);
  bg.renderOrder = 10; fill.renderOrder = 11;
  bar.add(bg, fill); scene.add(bar);
  const b = spec.bounds, m = 0.65;
  const e = {
    pos: new V3(spec.x, spec.y + 0.5, spec.z), vel: new V3(), half: { x: 0.5, y: 0.5, z: 0.5 }, grounded: true,
    hp: CFG.enemyHP, alive: true, bounds: [b[0] + m, b[1] - m, b[2] + m, b[3] - m],
    fireTimer: 2.0 + i * 0.2, burst: 0, strafeDir: i % 2 ? 1 : -1, strafeTimer: 1 + (i % 3) * 0.6,  // 2 s grace period after (re)start
    losTimer: 0, los: false, flash: 0, running: false,
    bar, fill, ...parts,
  };
  e.mesh.position.copy(e.pos);
  return e;
}

function clearDynamic() {
  for (const b of bullets) scene.remove(b.mesh); bullets.length = 0;
  for (const p of particles) scene.remove(p.mesh); particles.length = 0;
  for (const d of decals) scene.remove(d); decals.length = 0;
  for (const c of chunks) scene.remove(c.mesh); chunks.length = 0;
  for (const e of enemies) { scene.remove(e.mesh); scene.remove(e.bar); e.mat.dispose(); }
  enemies = [];
}

function restart() {
  clearDynamic();
  enemies = ENEMY_SPAWNS.map(createEnemy);
  Object.assign(player, { hp: CFG.playerHP, alive: true, grounded: false, coyote: 0, jumpBuf: 0, wallState: 'none', wallTimer: 0, wallNormal: null, lastWallNormal: null, wallJumpLock: 0, fireCd: 0, flash: 0 });
  player.pos.set(PLAYER_SPAWN.x, PLAYER_SPAWN.y, PLAYER_SPAWN.z);
  player.vel.set(0, 0, 0);
  player.mesh.visible = true;
  yaw = 0; pitch = -0.12; camPivotY = player.pos.y;
  setBulletTime(false); timeScale = 1; focus = CFG.focusMax; focusDelay = 0;
  hurt = 0; shake = 0; elapsed = 0; winTimer = -1; shotsFired = 0; shotsHit = 0;
  jumpQueued = false; firing = false;
  setState('playing');
}

// ------------------------------------------------------------------ effects
function addParticle(kind, pos, vel, size, life) {
  if (particles.length >= MAX_PARTICLES) { const old = particles.shift(); scene.remove(old.mesh); }
  const mesh = new THREE.Mesh(particleGeo, kind === 'blood' ? bloodMat : sparkMat);
  mesh.scale.setScalar(size); mesh.position.copy(pos);
  scene.add(mesh);
  particles.push({ kind, pos: pos.clone(), prev: pos.clone(), vel, life, size, mesh });
}
function addDecal(point, normal, size, mat) {
  if (decals.length >= MAX_DECALS) scene.remove(decals.shift());
  const m = new THREE.Mesh(decalGeo, mat);
  m.position.copy(point).addScaledVector(normal, 0.015);
  m.quaternion.setFromUnitVectors(Z_AXIS, normal);
  m.rotateZ(Math.random() * Math.PI * 2);
  m.scale.setScalar(size);
  m.renderOrder = 2;
  scene.add(m); decals.push(m);
}
function randUnit() {
  const v = new V3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1);
  return v.lengthSq() > 1e-6 ? v.normalize() : new V3(0, 1, 0);
}
function bloodBurst(point, dir, count, force = 1) {
  for (let i = 0; i < count; i++) {
    const v = dir.clone().multiplyScalar((2 + Math.random() * 5) * force).add(randUnit().multiplyScalar(3.2 * force));
    v.y += 1.5 + Math.random() * 2;
    addParticle('blood', point, v, 0.07 + Math.random() * 0.09, 3);
  }
}
function sparkBurst(point, normal) {
  for (let i = 0; i < 5; i++) {
    const v = normal.clone().multiplyScalar(3 + Math.random() * 3).add(randUnit().multiplyScalar(3));
    addParticle('spark', point, v, 0.05 + Math.random() * 0.04, 0.18 + Math.random() * 0.12);
  }
}
// Death: the cube breaks into eight blocks that fall and settle on whatever is below.
function collapse(body, color, impulse) {
  for (let i = 0; i < 8; i++) {
    const ox = (i & 1) ? 0.25 : -0.25, oy = (i & 2) ? 0.25 : -0.25, oz = (i & 4) ? 0.25 : -0.25;
    const mesh = new THREE.Mesh(chunkGeo, new THREE.MeshLambertMaterial({ color }));
    mesh.castShadow = true; mesh.receiveShadow = true;
    const pos = new V3(body.pos.x + ox, body.pos.y + oy, body.pos.z + oz);
    mesh.position.copy(pos); mesh.rotation.copy(body.mesh.rotation);
    scene.add(mesh);
    const vel = impulse.clone().multiplyScalar(2.5).add(new V3(ox * 5, oy > 0 ? 1.5 : 0, oz * 5)).add(randUnit().multiplyScalar(0.8));
    chunks.push({ pos, vel, half: { x: 0.25, y: 0.25, z: 0.25 }, grounded: false, mesh, spin: randUnit().multiplyScalar(4 + Math.random() * 4) });
  }
}

// ------------------------------------------------------------------ combat
function spawnBullet(owner, origin, dir) {
  const speed = owner === 'player' ? CFG.playerBulletSpeed : CFG.enemyBulletSpeed;
  const mesh = new THREE.Mesh(owner === 'player' ? pBulletGeo : eBulletGeo, owner === 'player' ? pBulletMat : eBulletMat);
  mesh.quaternion.setFromUnitVectors(Z_AXIS, dir);
  scene.add(mesh);
  const b = { owner, pos: origin.clone(), dir: dir.clone(), speed, life: owner === 'player' ? 2 : 4.5, len: owner === 'player' ? 1.4 : 1.0, mesh, traveled: 0 };
  placeBulletMesh(b);
  bullets.push(b);
}
function placeBulletMesh(b) {
  const back = Math.min(b.len / 2, b.traveled / 2);
  b.mesh.position.copy(b.pos).addScaledVector(b.dir, -back);
  b.mesh.scale.z = Math.max(0.05, Math.min(1, b.traveled / b.len));
}

function lookDir() { return new V3(-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch)); }
function rightDir() { return new V3(Math.cos(yaw), 0, -Math.sin(yaw)); }

function playerShoot() {
  const L = lookDir(), camPos = camera.position.clone();
  let t = rayWorld(camPos, L, 300);
  for (const e of enemies) if (e.alive) { const te = rayBody(camPos, L, e, 0.05); if (te < t) t = te; }
  const target = camPos.clone().addScaledVector(L, t);
  const f = new V3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const origin = player.pos.clone().addScaledVector(rightDir(), 0.57).addScaledVector(f, 0.5);
  const dir = target.clone().sub(origin);
  if (dir.dot(L) < 0.5 || dir.lengthSq() < 0.25) dir.copy(L); else dir.normalize();
  // If the muzzle is inside a wall (hugging it), fire from the cube centre instead.
  if (pointBox(origin)) origin.copy(player.pos);
  spawnBullet('player', origin, dir);
  muzzle.position.copy(origin).addScaledVector(dir, 0.85);
  muzzle.visible = true; muzzle.userData.t = 0.045;
  shotsFired++;
}

function damageEnemy(e, dmg, point, dir) {
  if (!e.alive) return;
  e.hp -= dmg; e.flash = 1; shotsHit++;
  hitmarkT = 0.12;
  bloodBurst(point, dir, 14);
  e.strafeDir *= -1; e.strafeTimer = 0.8;     // react: change direction when hit
  if (e.hp <= 0) {
    e.alive = false;
    scene.remove(e.mesh); scene.remove(e.bar);
    collapse(e, 0xc23030, dir);
    bloodBurst(e.pos.clone(), dir, 34, 1.2);
    if (enemies.every((x) => !x.alive)) winTimer = 1.4;
  }
}
function damagePlayer(dmg, point, dir) {
  if (!player.alive) return;
  player.hp = Math.max(0, player.hp - dmg);
  player.flash = 1;
  hurt = Math.min(1, hurt + 0.45 + dmg / 25);
  shake = Math.min(0.6, shake + 0.3);
  bloodBurst(point, dir, 12);
  const v = $('vitals'); v.classList.remove('hit'); void v.offsetWidth; v.classList.add('hit');
  if (player.hp <= 0) {
    player.alive = false;
    player.mesh.visible = false;
    collapse(player, 0x2f6fd6, dir);
    bloodBurst(player.pos.clone(), dir, 34, 1.2);
    setBulletTime(false);
    setState('dead');
  }
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    const step = b.speed * dt;
    let tHit = step, hitBox = null, hitBody = null;
    for (const bx of boxes) { const t = rayAABB(b.pos, b.dir, bx.min, bx.max); if (t < tHit) { tHit = t; hitBox = bx; hitBody = null; } }
    if (b.owner === 'player') {
      for (const e of enemies) if (e.alive) { const t = rayBody(b.pos, b.dir, e, 0.05); if (t < tHit) { tHit = t; hitBody = e; hitBox = null; } }
    } else if (player.alive) {
      const t = rayBody(b.pos, b.dir, player, 0.08); if (t < tHit) { tHit = t; hitBody = player; hitBox = null; }
    }
    if (hitBox || hitBody) {
      const point = b.pos.clone().addScaledVector(b.dir, tHit);
      if (hitBody === player) damagePlayer(CFG.enemyDamage, point, b.dir);
      else if (hitBody) damageEnemy(hitBody, CFG.playerDamage, point, b.dir);
      else {
        const n = faceNormal(point, hitBox);
        sparkBurst(point, n);
        addDecal(point, n, 0.16, holeDecalMat);
      }
      scene.remove(b.mesh); bullets.splice(i, 1);
      continue;
    }
    b.pos.addScaledVector(b.dir, step);
    b.traveled += step;
    b.life -= dt;
    if (b.life <= 0) { scene.remove(b.mesh); bullets.splice(i, 1); continue; }
    placeBulletMesh(b);
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vel.y -= CFG.gravity * dt * (p.kind === 'spark' ? 0.4 : 1);
    p.prev.copy(p.pos);
    p.pos.addScaledVector(p.vel, dt);
    p.life -= dt;
    let remove = p.life <= 0 || p.pos.y < -2;
    const b = pointBox(p.pos);
    if (b) {
      if (p.kind === 'blood') {
        // Figure out which face was crossed from the previous position and stick a splat there.
        const q = p.prev, n = new V3();
        if (q.y >= b.max.y) n.set(0, 1, 0); else if (q.y <= b.min.y) n.set(0, -1, 0);
        else if (q.x <= b.min.x) n.set(-1, 0, 0); else if (q.x >= b.max.x) n.set(1, 0, 0);
        else if (q.z <= b.min.z) n.set(0, 0, -1); else if (q.z >= b.max.z) n.set(0, 0, 1);
        else n.copy(faceNormal(p.pos, b));
        const hit = p.pos.clone();
        if (n.y > 0) hit.y = b.max.y; else if (n.y < 0) hit.y = b.min.y;
        else if (n.x < 0) hit.x = b.min.x; else if (n.x > 0) hit.x = b.max.x;
        else if (n.z < 0) hit.z = b.min.z; else hit.z = b.max.z;
        addDecal(hit, n, p.size * 4 + Math.random() * 0.35, bloodDecalMat);
      }
      remove = true;
    }
    if (remove) { scene.remove(p.mesh); particles.splice(i, 1); continue; }
    p.mesh.position.copy(p.pos);
    if (p.kind === 'spark') p.mesh.scale.setScalar(p.size * Math.max(0.2, p.life * 4));
  }
}

function updateChunks(dt) {
  const q = Math.PI / 2;
  for (const c of chunks) {
    c.vel.y = Math.max(-CFG.maxFall, c.vel.y - CFG.gravity * dt);
    const res = moveBody(c, dt, 0);
    if (res.hitX) c.vel.x *= -0.3;
    if (res.hitZ) c.vel.z *= -0.3;
    c.grounded = res.grounded;
    const r = c.mesh.rotation;
    if (c.grounded) {
      const k = Math.exp(-7 * dt);
      c.vel.x *= k; c.vel.z *= k; c.spin.multiplyScalar(Math.exp(-9 * dt));
      // settle flat onto the surface
      const s = 1 - Math.exp(-6 * dt);
      r.x += (Math.round(r.x / q) * q - r.x) * s;
      r.y += (Math.round(r.y / q) * q - r.y) * s * 0.3;
      r.z += (Math.round(r.z / q) * q - r.z) * s;
    } else {
      r.x += c.spin.x * dt; r.y += c.spin.y * dt; r.z += c.spin.z * dt;
    }
    c.mesh.position.copy(c.pos);
  }
}

// ------------------------------------------------------------------ player
function moveToward(cur, target, maxDelta) {
  const d = target - cur;
  return Math.abs(d) <= maxDelta ? target : cur + Math.sign(d) * maxDelta;
}
function updatePlayer(dt, rdt) {
  const P = player;
  P.fireCd -= rdt;
  P.flash = Math.max(0, P.flash - rdt * 5);
  P.mat.emissive.setScalar(P.flash * 0.8);
  if (!P.alive) return;

  const control = state === 'playing';
  const f = new V3(-Math.sin(yaw), 0, -Math.cos(yaw)), r = rightDir();
  let inF = 0, inR = 0;
  if (control) {
    if (keys.KeyW) inF += 1; if (keys.KeyS) inF -= 1;
    if (keys.KeyD) inR += 1; if (keys.KeyA) inR -= 1;
  }
  const wish = new V3().addScaledVector(f, inF).addScaledVector(r, inR);
  const hasInput = wish.lengthSq() > 0.01;
  if (hasInput) wish.normalize();
  const running = control && (keys.ShiftLeft || keys.ShiftRight);
  const speed = running ? CFG.runSpeed : CFG.walkSpeed;

  if (jumpQueued) { P.jumpBuf = CFG.jumpBuffer; jumpQueued = false; }
  P.jumpBuf -= dt;
  P.coyote = P.grounded ? CFG.coyote : Math.max(0, P.coyote - dt);
  P.wallJumpLock -= dt;
  if (P.grounded) P.lastWallNormal = null;

  const wall = P.grounded ? null : wallProbe(P, hasInput ? wish : null);
  const fresh = wall && (!P.lastWallNormal || wall.x * P.lastWallNormal.x + wall.z * P.lastWallNormal.z < 0.5);

  // --- jumping (ground, coyote, or off a wall)
  if (P.jumpBuf > 0 && control) {
    if (P.coyote > 0) {
      P.vel.y = CFG.jumpVel; P.coyote = 0; P.jumpBuf = 0; P.grounded = false;
    } else if (wall && P.wallJumpLock <= 0) {
      const vn = P.vel.x * wall.x + P.vel.z * wall.z;
      const ax = P.vel.x - wall.x * vn, az = P.vel.z - wall.z * vn;   // keep speed along the wall
      P.vel.x = ax * 0.85 + wall.x * CFG.wallJumpOut + wish.x * 2;
      P.vel.z = az * 0.85 + wall.z * CFG.wallJumpOut + wish.z * 2;
      P.vel.y = CFG.wallJumpUp;
      P.lastWallNormal = { x: wall.x, z: wall.z };
      P.wallState = 'none'; P.wallJumpLock = 0.18; P.jumpBuf = 0;
    }
  }

  // --- wall run / wall climb
  if (P.wallState === 'none' && wall && fresh && hasInput && P.wallJumpLock <= 0 && control) {
    const into = -(wish.x * wall.x + wish.z * wall.z);
    const vn = P.vel.x * wall.x + P.vel.z * wall.z;
    const along = Math.hypot(P.vel.x - wall.x * vn, P.vel.z - wall.z * vn);
    if (into > 0.8) {
      P.wallState = 'climb'; P.wallTimer = CFG.wallClimbTime; P.wallNormal = wall;
    } else if (along > CFG.wallRunMinSpeed && into > -0.4) {
      P.wallState = 'run'; P.wallTimer = CFG.wallRunTime; P.wallNormal = wall;
      P.vel.y = Math.min(Math.max(P.vel.y, 1.5), 4);
    }
  }
  if (P.wallState !== 'none') {
    P.wallTimer -= dt;
    const n = P.wallNormal;
    const same = wall && wall.x * n.x + wall.z * n.z > 0.9;
    if (!same || P.grounded || P.wallTimer <= 0 || !hasInput) {
      P.lastWallNormal = n; P.wallState = 'none';
    }
  }

  if (P.wallState === 'climb') {
    const n = P.wallNormal;
    P.vel.y = CFG.wallClimbSpeed;
    P.vel.x = -n.x * 1.5; P.vel.z = -n.z * 1.5;
  } else if (P.wallState === 'run') {
    const n = P.wallNormal;
    const vn = P.vel.x * n.x + P.vel.z * n.z;
    let tx = P.vel.x - n.x * vn, tz = P.vel.z - n.z * vn;
    const wn = wish.x * n.x + wish.z * n.z;
    const wx = wish.x - n.x * wn, wz = wish.z - n.z * wn;
    if (wx * tx + wz * tz < 0) { tx = -tx; tz = -tz; }   // follow the input direction along the wall
    const len = Math.hypot(tx, tz) || 1;
    const s = Math.min(CFG.runSpeed * 1.1, Math.max(CFG.runSpeed * 0.9, len));
    P.vel.x = tx / len * s - n.x * 1.5;
    P.vel.z = tz / len * s - n.z * 1.5;
    P.vel.y -= CFG.wallRunGravity * dt;
  } else {
    // regular ground/air movement
    const accel = (P.grounded ? CFG.groundAccel : CFG.airAccel) * dt;
    if (P.grounded || hasInput) {
      const tx = wish.x * speed, tz = wish.z * speed;
      if (P.grounded) { P.vel.x = moveToward(P.vel.x, tx, accel); P.vel.z = moveToward(P.vel.z, tz, accel); }
      else {
        // air control: steer, but don't kill momentum from wall jumps
        const cur = Math.hypot(P.vel.x, P.vel.z);
        P.vel.x = moveToward(P.vel.x, tx, accel); P.vel.z = moveToward(P.vel.z, tz, accel);
        const nw = Math.hypot(P.vel.x, P.vel.z), cap = Math.max(cur, speed);
        if (nw > cap) { P.vel.x *= cap / nw; P.vel.z *= cap / nw; }
      }
    }
    P.vel.y = Math.max(-CFG.maxFall, P.vel.y - CFG.gravity * dt);
  }

  const res = moveBody(P, dt, CFG.stepUp);
  P.grounded = res.grounded;
  if (res.ceil && P.wallState === 'climb') { P.wallState = 'none'; P.lastWallNormal = P.wallNormal; }
  if (P.pos.y < -10) { P.pos.set(PLAYER_SPAWN.x, PLAYER_SPAWN.y, PLAYER_SPAWN.z); P.vel.set(0, 0, 0); }

  P.mesh.position.copy(P.pos);
  P.mesh.rotation.set(0, yaw, 0);
  P.gun.rotation.x = pitch;

  if (control && firing && P.fireCd <= 0) { playerShoot(); P.fireCd = CFG.playerFireCooldown; }
}

// ------------------------------------------------------------------ enemies
function updateEnemy(e, dt) {
  e.flash = Math.max(0, e.flash - dt * 6);
  if (!e.alive) return;
  e.mat.emissive.setScalar(e.flash * 0.9);
  const P = player;
  const dx = P.pos.x - e.pos.x, dz = P.pos.z - e.pos.z;
  const dist = Math.hypot(dx, dz) || 0.001;
  const nx = dx / dist, nz = dz / dist, px = -nz, pz = nx;
  let mx = 0, mz = 0, speed = 0;

  e.strafeTimer -= dt;
  if (e.strafeTimer <= 0) { e.strafeDir = Math.random() < 0.5 ? -1 : 1; e.strafeTimer = 1.4 + Math.random() * 2.2; }

  if (P.alive) {
    if (dist < 13) { mx = -nx; mz = -nz; speed = 9; e.running = true; }                         // run away
    else if (dist < 22) { mx = -nx * 0.5 + px * e.strafeDir; mz = -nz * 0.5 + pz * e.strafeDir; speed = 6; e.running = true; } // back off while strafing
    else { mx = nx * 0.6 + px * e.strafeDir * 0.8; mz = nz * 0.6 + pz * e.strafeDir * 0.8; speed = 4.5; e.running = false; } // push to the roof edge to get a shot
    const ml = Math.hypot(mx, mz) || 1; mx /= ml; mz /= ml;
    // Stay on the roof: drop any component that would leave the bounds, then slide sideways if cornered.
    const b = e.bounds, look = 1.0;
    if (e.pos.x + mx * look < b[0] || e.pos.x + mx * look > b[1]) mx = 0;
    if (e.pos.z + mz * look < b[2] || e.pos.z + mz * look > b[3]) mz = 0;
    if (Math.hypot(mx, mz) < 0.3 && e.running) {
      for (const sgn of [e.strafeDir, -e.strafeDir]) {
        const tx = e.pos.x + px * sgn * look, tz = e.pos.z + pz * sgn * look;
        if (tx > b[0] && tx < b[1] && tz > b[2] && tz < b[3]) { mx = px * sgn; mz = pz * sgn; e.strafeDir = sgn; break; }
      }
    }
  }
  const accel = 30 * dt;
  e.vel.x = moveToward(e.vel.x, mx * speed, accel);
  e.vel.z = moveToward(e.vel.z, mz * speed, accel);
  e.vel.y = Math.max(-CFG.maxFall, e.vel.y - CFG.gravity * dt);
  const res = moveBody(e, dt, CFG.stepUp);
  e.grounded = res.grounded;
  if (res.hitX || res.hitZ) { e.strafeDir *= -1; e.strafeTimer = 1 + Math.random(); }
  const b = e.bounds;
  e.pos.x = Math.min(b[1], Math.max(b[0], e.pos.x));
  e.pos.z = Math.min(b[3], Math.max(b[2], e.pos.z));

  // Face and aim at the player
  e.mesh.position.copy(e.pos);
  e.mesh.rotation.set(0, Math.atan2(-dx, -dz), 0);
  e.gun.rotation.x = Math.atan2(P.pos.y - e.pos.y, dist);

  // Health bar billboard
  e.bar.position.set(e.pos.x, e.pos.y + 1.0, e.pos.z);
  e.bar.quaternion.copy(camera.quaternion);
  e.fill.scale.x = Math.max(0.001, e.hp / CFG.enemyHP);

  // Shooting
  if (!P.alive) return;
  const eye = new V3(e.pos.x, e.pos.y + 0.15, e.pos.z);
  const to = P.pos.clone().sub(eye);
  const d3 = to.length();
  e.losTimer -= dt;
  if (e.losTimer <= 0) {
    e.losTimer = 0.2;
    to.normalize();
    e.los = d3 < CFG.enemyRange && rayWorld(eye, to, d3) >= d3 - 0.6;
  }
  if (!e.los) { e.fireTimer = Math.max(e.fireTimer, 0.35); e.burst = 0; return; }
  e.fireTimer -= dt;
  if (e.fireTimer <= 0) {
    if (e.burst <= 0) e.burst = CFG.enemyBurst;
    e.burst--;
    // Within a burst shots come fast; between bursts a short pause (shorter still when cornered).
    e.fireTimer = e.burst > 0 ? CFG.enemyBurstGap : (dist < 13 ? 0.45 : CFG.enemyBurstDelay) + Math.random() * 0.5;
    const lead = d3 / CFG.enemyBulletSpeed * 0.7;
    const aim = P.pos.clone().addScaledVector(P.vel, lead).add(randUnit().multiplyScalar(0.3 + d3 * 0.012));
    const dir = aim.sub(eye).normalize();
    spawnBullet('enemy', eye.clone().addScaledVector(dir, 0.8), dir);
  }
}

// ------------------------------------------------------------------ camera
const camTmp = new V3();
function updateCamera(rdt) {
  const L = lookDir(), r = rightDir();
  camPivotY += (player.pos.y - camPivotY) * (1 - Math.exp(-14 * rdt));
  const pivot = new V3(player.pos.x, camPivotY + 0.85, player.pos.z);
  const dist = 5.5;
  const desired = pivot.clone().addScaledVector(L, -dist).addScaledVector(r, 0.95);
  desired.y += 0.35;
  camTmp.copy(desired).sub(pivot);
  const len = camTmp.length(); camTmp.normalize();
  const t = rayWorld(pivot, camTmp, len + 0.3);
  const camPos = t < len + 0.3 ? pivot.clone().addScaledVector(camTmp, Math.max(0.25, t - 0.3)) : desired;
  if (shake > 0 && !REDUCED_MOTION) camPos.add(randUnit().multiplyScalar(shake * 0.35));
  camera.position.copy(camPos);
  camera.lookAt(camPos.clone().add(L));
  const rollTarget = player.wallState === 'run' && player.wallNormal ? (player.wallNormal.x * r.x + player.wallNormal.z * r.z) * 0.12 : 0;
  camRoll += (rollTarget - camRoll) * (1 - Math.exp(-8 * rdt));
  camera.rotateZ(camRoll);
  const fovTarget = bulletTime ? 62 : 72;
  if (Math.abs(camera.fov - fovTarget) > 0.05) { camera.fov += (fovTarget - camera.fov) * (1 - Math.exp(-6 * rdt)); camera.updateProjectionMatrix(); }
}

// ------------------------------------------------------------------ HUD & overlays
const hud = { hp: -1, focus: -1, enemies: -1, tag: null };
function updateHUD() {
  const hp = Math.ceil(player.hp);
  if (hp !== hud.hp) {
    hud.hp = hp;
    $('hpText').textContent = hp;
    $('hpFill').style.width = (hp / CFG.playerHP * 100) + '%';
    $('vitals').classList.toggle('low', hp <= 30);
  }
  const fo = Math.round(focus);
  if (fo !== hud.focus) { hud.focus = fo; $('focusFill').style.width = (focus / CFG.focusMax * 100) + '%'; }
  const left = enemies.filter((e) => e.alive).length;
  if (left !== hud.enemies) { hud.enemies = left; $('enemyCount').textContent = left; }
  const tag = !player.alive ? '' : player.wallState === 'run' ? 'Wall run' : player.wallState === 'climb' ? 'Wall climb' : bulletTime ? 'Bullet time' : '';
  if (tag !== hud.tag) { hud.tag = tag; const el = $('moveTag'); el.textContent = tag; el.classList.toggle('on', !!tag); }
  $('hurt').style.opacity = Math.max(0, hurt).toFixed(3);
  $('crosshair').classList.toggle('hitmark', hitmarkT > 0);
}

const CONTROLS = `
  <div class="controls">
    <div><span>Aim</span><span>Mouse</span></div>
    <div><span>Shoot</span><span class="key">Left click</span></div>
    <div><span>Move</span><span><span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span></span></div>
    <div><span>Run</span><span class="key">Shift</span></div>
    <div><span>Jump / wall jump</span><span class="key">Space</span></div>
    <div><span>Bullet time</span><span><span class="key">Right click</span> or <span class="key">E</span></span></div>
    <div><span>Wall run</span><span>Jump along a wall</span></div>
    <div><span>Wall climb</span><span>Jump into a wall</span></div>
  </div>`;
function setState(s) {
  state = s;
  const o = $('overlay');
  o.className = '';
  o.hidden = false;
  if (s === 'start') {
    o.classList.add('clickable');
    o.innerHTML = `<div class="card">
      <h1><span class="b">Cube</span> Rooftops</h1>
      <p>Nine red cubes hold the rooftops above you. They keep their distance and shoot back in bursts. There are no stairs: follow the orange pillars and ledges, climb walls, or wall-jump up the narrow gap in front of the tall tower.</p>
      ${CONTROLS}
      <div class="cta">Click to start</div>
      <div class="note">Esc frees the mouse and pauses.</div>
    </div>`;
  } else if (s === 'paused') {
    o.classList.add('clickable');
    o.innerHTML = `<div class="card"><h1>Paused</h1>${CONTROLS}<div class="cta">Click to resume</div></div>`;
  } else if (s === 'dead') {
    o.classList.add('passive');
    o.innerHTML = `<div class="card dead"><h1>You were taken down</h1>
      <p>${enemies.filter((e) => !e.alive).length} of ${enemies.length} enemies cleared.</p>
      <div class="cta">Press <span class="key">R</span> to restart</div></div>`;
  } else if (s === 'won') {
    o.classList.add('passive');
    const acc = shotsFired ? Math.round(shotsHit / shotsFired * 100) : 0;
    o.innerHTML = `<div class="card won"><h1>Rooftops clear</h1>
      <p>All ${enemies.length} enemies down in ${elapsed.toFixed(1)} s with ${Math.ceil(player.hp)} health left. Accuracy ${acc}%.</p>
      <div class="cta">Press <span class="key">R</span> to restart</div></div>`;
  } else {
    o.hidden = true;
    o.innerHTML = '';
  }
}

function setBulletTime(on) {
  if (on && (focus < 8 || !player.alive || state !== 'playing')) return;
  bulletTime = on;
  document.body.classList.toggle('slowmo', on);
}

// ------------------------------------------------------------------ input
const BLOCK_KEYS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
addEventListener('keydown', (e) => {
  if (BLOCK_KEYS.has(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'Space') jumpQueued = true;
  if (e.code === 'KeyE' && state === 'playing') setBulletTime(!bulletTime);
  if (e.code === 'KeyR' && (state === 'dead' || state === 'won')) { restart(); lockPointer(); }
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; firing = false; });
addEventListener('contextmenu', (e) => e.preventDefault());
addEventListener('mousedown', (e) => {
  if (state !== 'playing') return;
  if (e.button === 0) firing = true;
  if (e.button === 2) setBulletTime(!bulletTime);
});
addEventListener('mouseup', (e) => { if (e.button === 0) firing = false; });
addEventListener('mousemove', (e) => {
  const locked = document.pointerLockElement === canvas;
  if (!locked && !fallbackAim) return;
  if (state === 'start' || state === 'paused') return;
  yaw -= e.movementX * CFG.mouseSens;
  pitch = Math.max(-1.25, Math.min(1.15, pitch - e.movementY * CFG.mouseSens));
});

function lockPointer() {
  if (fallbackAim) return;
  try {
    const p = canvas.requestPointerLock();
    if (p && typeof p.catch === 'function') p.catch(onLockError);
  } catch (err) { onLockError(); }
}
function onLockError() {
  // The page may be embedded somewhere that forbids pointer lock: fall back to free mouse + arrow keys.
  if (!everLocked) fallbackAim = true;
  else if (state === 'playing') setState('paused');
}
document.addEventListener('pointerlockerror', onLockError);
document.addEventListener('pointerlockchange', () => {
  const locked = document.pointerLockElement === canvas;
  if (locked) everLocked = true;
  else if (state === 'playing' && !fallbackAim) { firing = false; setState('paused'); }
});
$('overlay').addEventListener('click', () => {
  if (state === 'start') { restart(); lockPointer(); }
  else if (state === 'paused') { setState('playing'); lockPointer(); }
});
addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// ------------------------------------------------------------------ main loop
function simulate(rdt) {
  const target = bulletTime ? CFG.bulletTimeScale : 1;
  timeScale += (target - timeScale) * (1 - Math.exp(-10 * rdt));
  if (bulletTime) {
    focus -= CFG.focusDrain * rdt; focusDelay = CFG.focusRegenDelay;
    if (focus <= 0) { focus = 0; setBulletTime(false); }
  } else {
    focusDelay -= rdt;
    if (focusDelay <= 0) focus = Math.min(CFG.focusMax, focus + CFG.focusRegen * rdt);
  }
  const dt = rdt * timeScale;

  if (fallbackAim && state === 'playing') {
    if (keys.ArrowLeft) yaw += 2.4 * rdt;
    if (keys.ArrowRight) yaw -= 2.4 * rdt;
    if (keys.ArrowUp) pitch = Math.min(1.15, pitch + 1.6 * rdt);
    if (keys.ArrowDown) pitch = Math.max(-1.25, pitch - 1.6 * rdt);
  }
  if (state === 'playing') elapsed += rdt;

  updatePlayer(dt, rdt);
  for (const e of enemies) updateEnemy(e, dt);
  updateBullets(dt);
  updateParticles(dt);
  updateChunks(dt);

  if (winTimer > 0) { winTimer -= rdt; if (winTimer <= 0 && state === 'playing') { setBulletTime(false); setState('won'); } }
  hurt = Math.max(0, hurt - rdt * 1.4);
  shake = Math.max(0, shake - rdt * 1.8);
  hitmarkT -= rdt;
  if (muzzle.visible) { muzzle.userData.t -= rdt; if (muzzle.userData.t <= 0) muzzle.visible = false; }
  updateHUD();
}

let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state !== 'start' && state !== 'paused') simulate(rdt);
  updateCamera(rdt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// Initial scene behind the start screen
enemies = ENEMY_SPAWNS.map(createEnemy);
player.pos.set(PLAYER_SPAWN.x, PLAYER_SPAWN.y, PLAYER_SPAWN.z);
player.mesh.position.copy(player.pos);
for (const e of enemies) { e.bar.position.set(e.pos.x, e.pos.y + 1, e.pos.z); }
setState('start');
updateHUD();
requestAnimationFrame(frame);

// Handle for automated tests / tinkering from the console.
window.__game = {
  player, boxes, CFG, keys, simulate, restart, updateCamera,
  get enemies() { return enemies; }, get state() { return state; },
  get bullets() { return bullets; },
  setView(y, p) { yaw = y; pitch = p; },
  jump() { jumpQueued = true; },
  setFiring(v) { firing = v; },
  bulletTime: setBulletTime, get timeScale() { return timeScale; },
  noLock() { fallbackAim = true; },
  camPos: () => camera.position.clone(),
};
})();
</script>
</body>
</html>
