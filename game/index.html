<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cube Rooftops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed WebGL canvas; HUD pinned to the top corners; prompts centered over a dimmed scene. */
:root {
  --bg: #0f161d;
  --ink: #eef2f5;
  --ink-dim: rgba(238, 242, 245, 0.62);
  --panel: rgba(14, 20, 28, 0.72);
  --line: rgba(238, 242, 245, 0.2);
  --hp: #47d68a;
  --hp-low: #ff4b4b;
  --focus: #7cc4ff;
  --enemy: #ff5a4f;
  --player: #3f8cff;
  --route: #e8913f;
  --font-hud: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font-hud); }
canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }

/* No backdrop-filter on anything shown during play: blurring the live WebGL canvas every frame causes stutter. */
.panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; user-select: none; }
.label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.num { font-variant-numeric: tabular-nums; font-weight: 700; }

#vitals { top: calc(env(safe-area-inset-top, 0px) + 16px); left: max(16px, env(safe-area-inset-left, 0px)); width: 240px; display: grid; gap: 6px; }
#vitals .row { display: flex; justify-content: space-between; align-items: baseline; }
#hpText { font-size: 22px; line-height: 1; }
.bar { height: 14px; background: rgba(255, 255, 255, .12); border-radius: 3px; overflow: hidden; }
.bar.thin { height: 6px; }
.fill { height: 100%; width: 100%; transform-origin: left center; transition: transform .15s ease-out, background-color .2s; }
.fill.hp { background: var(--hp); }
.fill.focus { background: var(--focus); }
#vitals.low .fill.hp { background: var(--hp-low); }
#vitals.low #hpText { color: var(--hp-low); }
#vitals.hit { animation: jolt .28s ease-out; }
@keyframes jolt { 0% { transform: translate(0, 0); } 25% { transform: translate(-5px, 2px); } 50% { transform: translate(4px, -2px); } 75% { transform: translate(-2px, 1px); } 100% { transform: translate(0, 0); } }

#targets { top: calc(env(safe-area-inset-top, 0px) + 16px); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; align-items: baseline; }
#enemyCount { font-size: 22px; color: var(--enemy); }
#hint { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; gap: 8px; align-items: center; text-shadow: 0 1px 3px rgba(0,0,0,.9); pointer-events: none; }

#crosshair { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%); pointer-events: none; --ch: var(--ink); }
#crosshair::before, #crosshair::after { content: ""; position: absolute; background: var(--ch); box-shadow: 0 0 2px rgba(0,0,0,.8); }
#crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%, 0 65%, 100% 65%, 100% 100%, 0 100%); }
#crosshair::after { top: 10px; left: 0; height: 2px; width: 22px; clip-path: polygon(0 0, 35% 0, 35% 100%, 0 100%, 0 0, 65% 0, 100% 0, 100% 100%, 65% 100%); }
#crosshair.lock { --ch: var(--enemy); }
#crosshair.far { --ch: rgba(238, 242, 245, .35); }
#crosshair.hitmark { --ch: #fff; transform: translate(-50%, -50%) scale(1.25); }
#rangeTag { position: fixed; left: 50%; top: calc(50% + 20px); transform: translateX(-50%); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); text-shadow: 0 1px 3px rgba(0,0,0,.9); pointer-events: none; }

#moveTag { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateX(-50%); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; padding: 4px 10px; border-radius: 3px; background: var(--panel); border: 1px solid var(--line); opacity: 0; transition: opacity .15s; pointer-events: none; }
#moveTag.on { opacity: 1; }
#tip { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); transform: translateX(-50%); width: min(560px, calc(100% - 32px)); font-size: 15px; line-height: 1.4; text-align: center; padding: 8px 14px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); opacity: 0; transition: opacity .25s; pointer-events: none; }
#tip.on { opacity: 1; }
#tip b, #tip .k { color: var(--route); font-weight: 600; }
#reward { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); display: flex; gap: 14px; font-size: 15px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-shadow: 0 1px 4px rgba(0,0,0,.9); opacity: 0; pointer-events: none; }
#reward .hp { color: var(--hp); } #reward .bt { color: var(--focus); }
#reward.show { animation: reward 1.3s ease-out; }
@keyframes reward { 0% { opacity: 0; transform: translate(-50%, 8px); } 12% { opacity: 1; transform: translate(-50%, 0); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -14px); } }
#vitals.heal { animation: heal .6s ease-out; }
@keyframes heal { 0% { box-shadow: 0 0 0 0 rgba(71, 214, 138, .0); } 30% { box-shadow: 0 0 0 3px rgba(71, 214, 138, .8); } 100% { box-shadow: 0 0 0 0 rgba(71, 214, 138, 0); } }

#hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(200, 0, 0, 0) 42%, rgba(200, 0, 0, .55) 78%, rgba(150, 0, 0, .9) 100%); will-change: opacity; }
#slow { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s; background: radial-gradient(ellipse at center, rgba(70, 150, 255, 0) 45%, rgba(40, 110, 230, .38) 100%); }
body.slowmo #slow { opacity: 1; }

#overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: rgba(8, 12, 18, .72); }
#overlay.passive { pointer-events: none; background: radial-gradient(ellipse at center, rgba(8, 12, 18, .7) 0%, rgba(8, 12, 18, .35) 70%); }
#overlay.passive .card { text-shadow: 0 2px 10px rgba(0, 0, 0, .7); }
#overlay.clickable { cursor: pointer; }
.card { max-width: 620px; width: 100%; display: grid; gap: 14px; text-align: left; animation: rise .35s ease-out; }
@keyframes rise { from { transform: translateY(10px); opacity: .0; } to { transform: none; opacity: 1; } }
.card h1 { margin: 0; font-size: clamp(30px, 6vw, 52px); line-height: 1; letter-spacing: .03em; text-transform: uppercase; text-wrap: balance; }
.card h1 .b { color: var(--player); }
.card p { margin: 0; color: var(--ink-dim); font-size: 16px; line-height: 1.45; max-width: 62ch; }
.card p b { color: var(--route); font-weight: 600; }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 6px 22px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.controls div { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.controls span:first-child { color: var(--ink-dim); }
.key { display: inline-block; border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 4px; padding: 1px 8px; font-weight: 700; font-size: 13px; color: var(--ink); background: rgba(255,255,255,.06); }
.cta { font-size: 18px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.cta .key { font-size: 18px; padding: 2px 12px; }
.dead h1 { color: var(--hp-low); }
.won h1 { color: var(--hp); }
.note { font-size: 13px; color: var(--ink-dim); }
@media (prefers-reduced-motion: reduce) { .card, #vitals.hit, #vitals.heal { animation: none; } #reward.show { animation-duration: .01s; } }
</style>
</head>
<body>
<div id="vitals" class="panel">
  <div class="row"><span class="label">Health</span><span id="hpText" class="num">100</span></div>
  <div class="bar"><div id="hpFill" class="fill hp"></div></div>
  <div class="row"><span class="label">Bullet time</span><span class="label">RMB / E</span></div>
  <div class="bar thin"><div id="focusFill" class="fill focus"></div></div>
</div>
<div id="targets" class="panel"><span class="label">Enemies left</span><span id="enemyCount" class="num">0</span></div>
<div id="hint" class="label"><span class="key">R</span> Restart <span class="key">M</span> <span id="soundState">Sound on</span></div>
<div id="crosshair"></div>
<div id="rangeTag" hidden>Out of range</div>
<div id="moveTag"></div>
<div id="tip"></div>
<div id="reward"></div>
<div id="slow"></div>
<div id="hurt"></div>
<div id="overlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const V3 = THREE.Vector3;
const $ = (id) => document.getElementById(id);

// ------------------------------------------------------------------ tuning
const CFG = {
  gravity: 28, maxFall: 32,
  walkSpeed: 7.5, runSpeed: 13,
  groundAccel: 85, airAccel: 20,
  jumpVel: 10, coyote: 0.1, jumpBuffer: 0.14,
  stepUp: 0.6,
  wallRunTime: 1.25, wallRunMinSpeed: 3.5,      // a wall run holds you level: it never lifts you up
  wallClimbTime: 0.3, wallClimbSpeed: 7.5,
  wallJumpOut: 8.5, wallJumpUp: 9.8,           // neutral wall jump (holding along the wall, or no input)
  wallJumpUpOut: 2.5, wallJumpUpUp: 13,        // holding toward the wall: jump mostly up
  wallJumpAwayOut: 12, wallJumpAwayUp: 8,      // holding away from the wall: leap out
  playerHP: 100, enemyHP: 75,
  playerBulletSpeed: 95, playerDamage: 25, playerFireCooldown: 0.13, playerRange: 60,
  enemyBulletSpeed: 42, enemyDamage: 12, enemyRange: 50, enemyBulletRange: 60,
  enemyBurst: 3, enemyBurstGap: 0.13, enemyBurstDelay: 1.3,   // 3-round bursts, ~1.3-1.8 s apart
  killHeal: 20, killFocus: 35,                // push-forward combat: kills refill health and bullet time
  wallRunDecay: 3,                             // m/s lost per second on the wall: a wall run never speeds you up
  enemySpreadVsWallRun: 2.4,                   // enemies struggle to hit a wall-running / fast airborne player
  enemyReaction: 0.6,                          // seconds an enemy waits after coming on screen before firing
  sniperRange: 80, sniperCharge: 1.3, sniperLock: 0.3, sniperDamage: 28, sniperBulletSpeed: 95,
  rusherRange: 14, rusherPellets: 4, rusherPelletDamage: 6,
  enemyMaxDrop: 7,                             // enemies posted this high or lower may decide to jump down to the floor
  bulletTimeScale: 0.25, focusMax: 100, focusDrain: 24, focusRegen: 12, focusRegenDelay: 1.0,
  mouseSens: 0.0022,
};
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ------------------------------------------------------------------ sound (synthesized with Web Audio, no files)
// Starts on the first click or key press (browsers block audio before that). M toggles it.
const SFX = (() => {
  let ctx = null, master = null, lp = null, noiseBuf = null, muted = false, wallLoop = null;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ctx = new AC(); } catch (e) { ctx = null; return; }
    lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 18000;
    master = ctx.createGain(); master.gain.value = 0.55;
    lp.connect(master); master.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const on = () => ctx && !muted && ctx.state === 'running';
  function bus(gain, pan) {
    const g = ctx.createGain(); g.gain.value = 0;
    if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); g.connect(p); p.connect(lp); }
    else g.connect(lp);
    return g;
  }
  function noise(dur, o) {
    const t = ctx.currentTime + (o.delay || 0), src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = bus(0, o.pan);
    src.buffer = noiseBuf; f.type = o.type || 'bandpass'; f.frequency.value = o.freq; f.Q.value = o.q || 1;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(o.gain, t + (o.attack || 0.003)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  }
  function tone(dur, o) {
    const t = ctx.currentTime + (o.delay || 0), osc = ctx.createOscillator(), g = bus(0, o.pan);
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(o.freq, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(o.gain, t + (o.attack || 0.004)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); osc.start(t); osc.stop(t + dur + 0.05);
  }
  // distance falloff and stereo position relative to the camera
  const _d = new THREE.Vector3(), _rr = new THREE.Vector3();
  function place(pos, range = 70) {
    _d.copy(pos).sub(camera.position); const dist = _d.length();
    _rr.set(1, 0, 0).applyQuaternion(camera.quaternion);
    return { vol: clamp(1 - dist / range, 0, 1) ** 1.5, pan: dist > 0.01 ? _d.dot(_rr) / dist * 0.8 : 0 };
  }
  return {
    init,
    get muted() { return muted; },
    toggle() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.55; if (muted) this.wallRun(false); return muted; },
    shoot() { if (!on()) return; noise(0.11, { gain: 0.45, freq: 2200, q: 0.6, to: 500 }); tone(0.09, { gain: 0.3, freq: 170, to: 45, type: 'triangle' }); },
    enemyShot(pos, kind) {
      if (!on()) return; const { vol, pan } = place(pos); if (vol <= 0.01) return;
      if (kind === 'sniper') { noise(0.35, { gain: 0.5 * vol, freq: 3000, q: 0.5, to: 300, pan }); tone(0.3, { gain: 0.25 * vol, freq: 120, to: 35, type: 'sawtooth', pan }); }
      else if (kind === 'rusher') { noise(0.18, { gain: 0.5 * vol, freq: 900, q: 0.5, to: 200, pan }); tone(0.14, { gain: 0.3 * vol, freq: 90, to: 40, type: 'triangle', pan }); }
      else { noise(0.1, { gain: 0.35 * vol, freq: 1400, q: 0.7, to: 400, pan }); tone(0.08, { gain: 0.18 * vol, freq: 140, to: 50, type: 'triangle', pan }); }
    },
    sniperCharge(pos, dur) { if (!on()) return; const { vol, pan } = place(pos, 90); if (vol <= 0.01) return; tone(dur, { gain: 0.07 * vol, freq: 500, to: 1600, type: 'sine', pan, attack: 0.05 }); },
    impact(pos) { if (!on()) return; const { vol, pan } = place(pos, 40); if (vol <= 0.01) return; noise(0.05, { gain: 0.18 * vol, freq: 3500, q: 1.5, pan }); },
    hit() { if (!on()) return; tone(0.08, { gain: 0.2, freq: 260, to: 120, type: 'square' }); noise(0.06, { gain: 0.15, freq: 700, q: 1 }); },
    kill() { if (!on()) return; tone(0.4, { gain: 0.45, freq: 130, to: 40 }); tone(0.3, { gain: 0.1, freq: 880, to: 1320, type: 'triangle', delay: 0.05 }); noise(0.25, { gain: 0.2, freq: 500, q: 0.6, to: 150 }); },
    hurt() { if (!on()) return; tone(0.22, { gain: 0.35, freq: 95, to: 45, type: 'sawtooth' }); noise(0.14, { gain: 0.2, freq: 450, q: 0.8 }); },
    step(run) { if (!on()) return; noise(0.05, { gain: run ? 0.09 : 0.06, freq: 700 + Math.random() * 500, q: 1.2 }); },
    jump() { if (!on()) return; noise(0.14, { gain: 0.08, freq: 600, to: 1800, type: 'highpass' }); },
    wallJump() { if (!on()) return; noise(0.18, { gain: 0.14, freq: 500, to: 2400, q: 0.8 }); tone(0.1, { gain: 0.08, freq: 300, to: 600, type: 'triangle' }); },
    land(strength) { if (!on()) return; const s = clamp(strength, 0, 1); tone(0.12, { gain: 0.15 + 0.25 * s, freq: 110, to: 50 }); noise(0.08, { gain: 0.08 + 0.12 * s, freq: 500, q: 0.7 }); },
    wallRun(active) {
      if (!ctx) return;
      if (active && on() && !wallLoop) {
        const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = bus(0);
        src.buffer = noiseBuf; src.loop = true; f.type = 'bandpass'; f.frequency.value = 650; f.Q.value = 0.9;
        g.gain.linearRampToValueAtTime(0.09, ctx.currentTime + 0.08);
        src.connect(f); f.connect(g); src.start(); wallLoop = { src, g };
      } else if (!active && wallLoop) {
        const { src, g } = wallLoop; wallLoop = null;
        g.gain.cancelScheduledValues(ctx.currentTime); g.gain.setValueAtTime(g.gain.value, ctx.currentTime);
        g.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.12); src.stop(ctx.currentTime + 0.15);
      }
    },
    slow(active) {
      if (!ctx) return;
      lp.frequency.cancelScheduledValues(ctx.currentTime); lp.frequency.setValueAtTime(lp.frequency.value, ctx.currentTime);
      lp.frequency.exponentialRampToValueAtTime(active ? 900 : 18000, ctx.currentTime + 0.3);
      if (on()) tone(0.5, { gain: 0.2, freq: active ? 320 : 80, to: active ? 70 : 320 });
    },
    heartbeat() { if (!on()) return; tone(0.13, { gain: 0.35, freq: 70, to: 40 }); tone(0.13, { gain: 0.25, freq: 65, to: 38, delay: 0.19 }); },
  };
})();

// ------------------------------------------------------------------ level data
// Everything is an axis-aligned box. Units are metres; a character cube is 1 m. Forward is -z.
//
// Level structure, following a few well-known level-design principles:
//  * One critical path built for momentum (Mirror's Edge "flow"): each move sets up the next one, and every
//    traversal surface is orange, so the route reads at a glance ("runner vision").
//  * Teach -> test -> combine (Titanfall 2 forces wall running early): the first two sections teach the
//    wall run and the wall-jump shaft with no enemies around; the arenas then test them under fire,
//    and the later sections combine them.
//  * Traversal sections alternate with combat arenas ("combat bowls" joined by corridors, Gears of War /
//    Ghostrunner). Each arena has enemies on three height layers, cover with hard corners,
//    a high overlook on entry, and both a low route (fight across the floor) and a faster high route.
//  * A landmark (the "weenie") - the red-tipped spire at the far end - is visible from the start.
//  * Falling never kills you: every gap drops onto the ground floor with a climbable way back up.
//
// Movement budget the geometry is built around: jump +1.7 m; running jump ~9 m; jump-into-wall climb ~+4.5 m;
// wall run ~1.25 s / ~16 m; wall jumps between walls 3-3.5 m apart climb indefinitely.
const boxes = [];      // solid (collision + render)
const deco = [];       // visual only
function addBox(x0, y0, z0, x1, y1, z1, kind, tint = 0, list = boxes) {
  const b = {
    min: { x: Math.min(x0, x1), y: Math.min(y0, y1), z: Math.min(z0, z1) },
    max: { x: Math.max(x0, x1), y: Math.max(y0, y1), z: Math.max(z0, z1) },
    kind, tint, q: 0,
  };
  list.push(b);
  return b;
}
function block(cx, cz, w, d, h, y0, kind, tint, list) { return addBox(cx - w / 2, y0, cz - d / 2, cx + w / 2, y0 + h, cz + d / 2, kind, tint, list); }

const L = {};   // named pieces, referenced by enemy posts and tests
const HINTS = [];
function hint(x0, z0, x1, z1, y0, text, y1 = Infinity) { HINTS.push({ x0: Math.min(x0, x1), x1: Math.max(x0, x1), z0: Math.min(z0, z1), z1: Math.max(z0, z1), y0, y1, text }); }

function buildLevel() {
  addBox(-40, -1, -272, 40, 0, 32, 'ground');

  // --- City shell: a canyon of buildings around the path (also blocks the sky-line edges)
  const shell = [
    // each section has its own look: warm old town -> construction site -> brick courtyard -> slate industrial -> glass plaza
    [-40, -14, 32, -5, 18, 'warm1'], [-40, -14, -5, -40, 26, 'warm2'], [-40, -14, -40, -80, 20, 'raw'],
    [14, 40, 32, -15, 24, 'warm2'], [14, 40, -15, -50, 16, 'warm1'], [14, 40, -50, -80, 28, 'raw'],
    [-40, -30, -80, -130, 30, 'brick1'], [30, 40, -80, -130, 30, 'brick2'],
    [-40, -14, -130, -172, 24, 'slate1'], [14, 40, -130, -172, 20, 'slate0'],
    [-40, -12, -172, -195, 26, 'slate0'], [12, 40, -172, -195, 22, 'slate1'],
    [-40, -30, -195, -232, 34, 'glass1'], [30, 40, -195, -226, 30, 'glass0'],
    [-40, -18, -232, -264, 28, 'marble'], [18, 40, -226, -264, 24, 'glass1'],
    [-40, 40, -264, -272, 40, 'glass0'], [-40, 40, 24, 32, 20, 'warm1'],
  ];
  for (const [x0, x1, z0, z1, h, t] of shell) addBox(x0, 0, z0, x1, h, z1, 'building', t);

  // --- 1. Start roof (safe). It spans wall to wall, so there is no way around the first gap. The spire is ahead.
  L.A = addBox(-14, 0, -12, 14, 6, 24, 'building', 'warm0');
  hint(-14, -12, 14, 24, 5, 'Hold <b>Shift</b> to run. Run along the tall <b>orange wall</b> on the left and jump at the edge to wall-run across.');

  // --- 2. Teach the wall run: the only gap is a 4 m channel along the orange wall, 14 m long (too far to jump).
  //        Everything to the right of it is a 12 m block you can't climb from the start roof.
  L.wr1 = addBox(-9.5, 0, -26, -8, 12, -12, 'route');

const CELL = 8, grid = new Map();

  for (let ix = cellOf(x0); ix <= ix1; ix++) for (let iz = iz0; iz <= iz1; iz++) {
    const c = grid.get(ix * 4096 + iz); if (!c) continue;
    for (let i = 0; i < c.length; i++) { const b = c[i]; if (b.q !== qStamp) { b.q = qStamp; out.push(b); } }
  }

function spawnBullet(owner, origin, dir, o = {}) {

  const list = bullets.filter((b) => b.owner === owner);
  if (list.length >= (isP ? MAX.pBullets : MAX.eBullets)) bullets.splice(bullets.indexOf(list[0]), 1);
  bullets.push({ owner, pos: origin.clone(), dir: dir.clone(),
    speed: o.speed || (isP ? CFG.playerBulletSpeed : CFG.enemyBulletSpeed),
    damage: o.damage || (isP ? CFG.playerDamage : CFG.enemyDamage),
    remain: o.range || (isP ? CFG.playerRange : CFG.enemyBulletRange), len: isP ? 1.4 : 1.0, traveled: 0 });
}

    if (e.charge > 0) { e.charge = 0; e.fireTimer = Math.max(e.fireTimer, 0.8); }
    if (e.laser) e.laser.visible = false;
    return;
  }
  if (!e.seen) { e.seen = true; e.fireTimer = Math.max(e.fireTimer, e.type === 'rusher' ? 0.4 : CFG.enemyReaction); }
  e.fireTimer -= dt;

  if (e.type === 'sniper') {
    // Telegraph: a laser tracks you while the shot charges, then locks for the last moment (dodge it!).
    if (e.charge <= 0 && e.fireTimer <= 0) { e.charge = CFG.sniperCharge; SFX.sniperCharge(eye, CFG.sniperCharge); }
    if (e.charge > 0) {
      e.charge -= dt;
      if (e.charge > CFG.sniperLock) e.aimLock.copy(P.pos);
      const dirL = _aimPt.copy(e.aimLock).sub(eye); const lenL = dirL.length(); dirL.multiplyScalar(1 / lenL);
      const hitT = Math.min(lenL + 30, rayWorld(eye, dirL, lenL + 30));
      e.laser.visible = true; e.laser.position.copy(eye);
      e.laser.quaternion.setFromUnitVectors(Z_AXIS, dirL); e.laser.scale.set(1, 1, hitT);
      if (e.charge <= 0) {
        e.laser.visible = false;
        const dir = dirL.clone().addScaledVector(randUnit(_p), 0.012 * (evasive ? CFG.enemySpreadVsWallRun : 1)).normalize();
        spawnBullet('enemy', eye.clone().addScaledVector(dir, 1.2), dir, { speed: CFG.sniperBulletSpeed, damage: CFG.sniperDamage, range: CFG.sniperRange + 10 });
        SFX.enemyShot(eye, 'sniper');
        e.fireTimer = 2.4 + Math.random() * 0.8;
      }
    }
    return;
  }
  if (e.fireTimer > 0) return;
  if (e.type === 'rusher') {
    // close-range spread: several pellets at once
    const aim = _aimPt.copy(P.pos).addScaledVector(P.vel, d3 / CFG.enemyBulletSpeed * 0.5).sub(eye).normalize();
    for (let k = 0; k < CFG.rusherPellets; k++) {
      const dir = aim.clone().addScaledVector(randUnit(_p), 0.1 * (evasive ? 1.6 : 1)).normalize();
      spawnBullet('enemy', eye.clone().addScaledVector(dir, 0.6), dir, { damage: CFG.rusherPelletDamage, range: CFG.rusherRange + 6 });
    }
    SFX.enemyShot(eye, 'rusher');
    e.fireTimer = 1.3 + Math.random() * 0.4;
    return;
  }
  if (e.burst <= 0) e.burst = CFG.enemyBurst;
  e.burst--;
  e.fireTimer = e.burst > 0 ? CFG.enemyBurstGap : (dist < 13 ? 0.45 : CFG.enemyBurstDelay) + Math.random() * 0.5;
  const lead = d3 / CFG.enemyBulletSpeed * 0.7;
  const spread = (0.3 + d3 * 0.012) * (evasive ? CFG.enemySpreadVsWallRun : 1);
  const target = _aimPt.copy(P.pos).addScaledVector(P.vel, lead).addScaledVector(randUnit(_p), spread);
  const dir = target.sub(eye).normalize();
  spawnBullet('enemy', eye.clone().addScaledVector(dir, 0.8), dir);
  SFX.enemyShot(eye, 'rifle');
}

// ------------------------------------------------------------------ camera
const frustum = new THREE.Frustum(), _pv = new THREE.Matrix4();
const _pivot = new V3(), _desired = new V3(), _camDir = new V3(), _camPos = new V3(), _look = new V3(), _cr = new V3();
// Third-person camera. In tight spaces it keeps to the open side: while wall running the shoulder moves
// away from the wall, and near a single wall it swaps to the other shoulder. Collisions pull it in
// instantly but it eases back out, so it doesn't pump in narrow corridors. When it ends up very close,
// the player cube turns see-through so it never blocks the view.
let camShoulder = 0.95, camDist = 5.5, camSide = 1;
const _neg = new V3();
function updateCamera(rdt) {
  const L = lookDir(_L), r = rightDir(_cr);
  camPivotY += (player.pos.y - camPivotY) * (1 - Math.exp(-14 * rdt));
  const pivot = _pivot.set(player.pos.x, camPivotY + 0.85, player.pos.z);
  const right = rayWorld(pivot, r, 2.2), left = rayWorld(pivot, _neg.copy(r).negate(), 2.2);
  if (player.wallState === 'run' && player.wallNormal) {
    camSide = (player.wallNormal.x * r.x + player.wallNormal.z * r.z) >= 0 ? 1 : -1;   // away from the wall
  } else if (right < 1.5 && left > right + 0.4) camSide = -1;
  else if (left < 1.5 && right > left + 0.4) camSide = 1;
  else if (right > 2.1 && left > 2.1) camSide = 1;                                      // open space: default right shoulder
  const tight = Math.min(left, right) < 2.2 || player.wallState !== 'none';
  const shoulderTarget = camSide * (tight ? 0.7 : 0.95);
  camShoulder += (shoulderTarget - camShoulder) * (1 - Math.exp(-9 * rdt));
  const distTarget = player.wallState === 'run' ? 4.6 : tight ? 5 : 5.5;
  const desired = _desired.copy(pivot).addScaledVector(L, -distTarget).addScaledVector(r, camShoulder);
  desired.y += 0.35;
  _camDir.copy(desired).sub(pivot);
  const len = _camDir.length(); _camDir.multiplyScalar(1 / len);
  const t = rayWorld(pivot, _camDir, len + 0.3);
  const allowed = t < len + 0.3 ? Math.max(0.25, t - 0.3) : len;
  if (allowed < camDist) camDist = allowed;                                             // snap in: never clip
  else camDist += (allowed - camDist) * (1 - Math.exp(-5 * rdt));                       // ease back out
  const camPos = _camPos.copy(pivot).addScaledVector(_camDir, camDist);
  if (shake > 0 && !REDUCED_MOTION) camPos.addScaledVector(randUnit(_look), shake * 0.35);
  camera.position.copy(camPos);
  camera.lookAt(_look.copy(camPos).add(L));
  const rollTarget = player.wallState === 'run' && player.wallNormal ? (player.wallNormal.x * r.x + player.wallNormal.z * r.z) * 0.12 : 0;
  camRoll += (rollTarget - camRoll) * (1 - Math.exp(-8 * rdt));
  camera.rotateZ(camRoll);
  camera.updateMatrixWorld();
  frustum.setFromProjectionMatrix(_pv.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse));
  const near = camPos.distanceTo(player.pos);
  player.mat.opacity = Math.min(1, Math.max(0.25, (near - 0.9) / 1.3));
  const fovTarget = (bulletTime ? 62 : 72) + (player.wallState === 'run' ? 4 : 0);
  if (Math.abs(camera.fov - fovTarget) > 0.05) { camera.fov += (fovTarget - camera.fov) * (1 - Math.exp(-6 * rdt)); camera.updateProjectionMatrix(); }
}

// ------------------------------------------------------------------ HUD & overlays
// Only touch the DOM when a value actually changes.
const hud = { hp: -1, focus: -1, enemies: -1, tag: null, hurt: -1, ch: null, tip: null };
const el = { hpText: $('hpText'), hpFill: $('hpFill'), vitals: $('vitals'), focusFill: $('focusFill'), enemyCount: $('enemyCount'),
  moveTag: $('moveTag'), hurt: $('hurt'), crosshair: $('crosshair'), rangeTag: $('rangeTag'), reward: $('reward'), tip: $('tip') };
function updateHUD() {
  const hp = Math.ceil(player.hp);
  if (hp !== hud.hp) {
    hud.hp = hp;
    el.hpText.textContent = hp;
    el.hpFill.style.transform = `scaleX(${hp / CFG.playerHP})`;
    el.vitals.classList.toggle('low', hp <= 30);
  }
  const fo = Math.round(focus);
  if (fo !== hud.focus) { hud.focus = fo; el.focusFill.style.transform = `scaleX(${focus / CFG.focusMax})`; }
  let left = 0; for (const e of enemies) if (e.alive) left++;
  if (left !== hud.enemies) { hud.enemies = left; el.enemyCount.textContent = left; }
  const tag = !player.alive ? '' : player.wallState === 'run' ? 'Wall run' : player.wallState === 'climb' ? 'Wall climb' : bulletTime ? 'Bullet time' : '';
  if (tag !== hud.tag) { hud.tag = tag; el.moveTag.textContent = tag; el.moveTag.classList.toggle('on', !!tag); }
  const hu = Math.round(Math.max(0, hurt) * 100) / 100;
  if (hu !== hud.hurt) { hud.hurt = hu; el.hurt.style.opacity = hu; }
  let tip = '';
  if (player.alive && state === 'playing') for (const h of HINTS) {
    const p = player.pos;
    if (p.x >= h.x0 && p.x <= h.x1 && p.z >= h.z0 && p.z <= h.z1 && p.y >= h.y0 && p.y <= h.y1) { tip = h.text; break; }
  }
  if (tip !== hud.tip) { hud.tip = tip; el.tip.innerHTML = tip; el.tip.classList.toggle('on', !!tip); }
  const ch = hitmarkT > 0 ? 'hitmark' : aim.enemy ? (aim.dist <= CFG.playerRange ? 'lock' : 'far') : '';
  if (ch !== hud.ch) { hud.ch = ch; el.crosshair.className = ch; el.rangeTag.hidden = ch !== 'far'; }
}

const CONTROLS = `
  <div class="controls">
    <div><span>Aim</span><span>Mouse</span></div>
    <div><span>Shoot</span><span class="key">Left click</span></div>
    <div><span>Move</span><span><span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span></span></div>
    <div><span>Run</span><span class="key">Shift</span></div>
    <div><span>Jump</span><span class="key">Space</span></div>
    <div><span>Wall jump up / away</span><span>Space + toward / away from wall</span></div>
    <div><span>Bullet time</span><span><span class="key">Right click</span> or <span class="key">E</span></span></div>
    <div><span>Wall run</span><span>Run and jump along a wall</span></div>
    <div><span>Wall climb</span><span>Jump into a wall</span></div>
    <div><span>Restart (any time)</span><span class="key">R</span></div>
  </div>`;
function setState(s) {
  state = s;
  const o = $('overlay');
  o.className = '';
  o.hidden = false;
  if (s === 'start') {
    o.classList.add('clickable');
    o.innerHTML = `<div class="card">
      <h1><span class="b">Cube</span> Rooftops</h1>
      <p>Make your way to the red-tipped spire and clear the fourteen red cubes on the way. Everything <b>orange</b> is made for moving: wall-run along it, jump between it, climb it. Each kill gives back health and bullet time, so keep pushing forward. Guns reach about 60 m, and enemies only fire when they're on your screen.</p>
      ${CONTROLS}
      <div class="cta">Click to start</div>
      <div class="note">Esc frees the mouse and pauses.</div>
    </div>`;
  } else if (s === 'paused') {
    o.classList.add('clickable');
    o.innerHTML = `<div class="card"><h1>Paused</h1>${CONTROLS}<div class="cta">Click to resume</div></div>`;
  } else if (s === 'dead') {
    o.classList.add('passive');
    o.innerHTML = `<div class="card dead"><h1>You were taken down</h1>
      <p>${enemies.filter((e) => !e.alive).length} of ${enemies.length} enemies cleared.</p>
      <div class="cta">Press <span class="key">R</span> to restart</div></div>`;
  } else if (s === 'won') {
    o.classList.add('passive');
    const acc = shotsFired ? Math.round(shotsHit / shotsFired * 100) : 0;
    o.innerHTML = `<div class="card won"><h1>Level clear</h1>
      <p>All ${enemies.length} enemies down in ${elapsed.toFixed(1)} s with ${Math.ceil(player.hp)} health left. Accuracy ${acc}%.</p>
      <div class="cta">Press <span class="key">R</span> to restart</div></div>`;
  } else {
    o.hidden = true;
    o.innerHTML = '';
  }
}

function setBulletTime(on) {
  if (on && (focus < 8 || !player.alive || state !== 'playing')) return;
  if (on !== bulletTime) SFX.slow(on);
  bulletTime = on;
  document.body.classList.toggle('slowmo', on);
}

// ------------------------------------------------------------------ input
const BLOCK_KEYS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
addEventListener('keydown', (e) => {
  if (BLOCK_KEYS.has(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.repeat) return;
  SFX.init();
  if (e.code === 'Space') jumpQueued = true;
  if (e.code === 'KeyM') { const m = SFX.toggle(); $('soundState').textContent = m ? 'Sound off' : 'Sound on'; }
  if (e.code === 'KeyE' && state === 'playing') setBulletTime(!bulletTime);
  if (e.code === 'KeyR' && state !== 'start') { restart(); lockPointer(); }   // restart at any moment
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; firing = false; });
addEventListener('contextmenu', (e) => e.preventDefault());
addEventListener('mousedown', (e) => {
  if (state !== 'playing') return;
  if (e.button === 0) firing = true;
  if (e.button === 2) setBulletTime(!bulletTime);
});
addEventListener('mouseup', (e) => { if (e.button === 0) firing = false; });
addEventListener('mousemove', (e) => {
  const locked = document.pointerLockElement === canvas;
  if (!locked && !fallbackAim) return;
  if (state === 'start' || state === 'paused') return;
  yaw -= e.movementX * CFG.mouseSens;
  pitch = Math.max(-1.25, Math.min(1.15, pitch - e.movementY * CFG.mouseSens));
});

function lockPointer() {
  if (fallbackAim) return;
  try {
    const p = canvas.requestPointerLock();
    if (p && typeof p.catch === 'function') p.catch(onLockError);
  } catch (err) { onLockError(); }
}
function onLockError() {
  // Embedded somewhere that forbids pointer lock: fall back to free mouse + arrow keys.
  if (!everLocked) fallbackAim = true;
  else if (state === 'playing') setState('paused');
}
document.addEventListener('pointerlockerror', onLockError);
document.addEventListener('pointerlockchange', () => {
  const locked = document.pointerLockElement === canvas;
  if (locked) everLocked = true;
  else if (state === 'playing' && !fallbackAim) { firing = false; setState('paused'); }
});
$('overlay').addEventListener('click', () => {
  SFX.init();
  if (state === 'start') { restart(); lockPointer(); }
  else if (state === 'paused') { setState('playing'); lockPointer(); }
});
addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// ------------------------------------------------------------------ main loop
function simulate(rdt) {
  const target = bulletTime ? CFG.bulletTimeScale : 1;
  timeScale += (target - timeScale) * (1 - Math.exp(-10 * rdt));
  if (bulletTime) {
    focus -= CFG.focusDrain * rdt; focusDelay = CFG.focusRegenDelay;
    if (focus <= 0) { focus = 0; setBulletTime(false); }
  } else {
    focusDelay -= rdt;
    if (focusDelay <= 0) focus = Math.min(CFG.focusMax, focus + CFG.focusRegen * rdt);
  }
  hitStop -= rdt;
  const dt = rdt * timeScale * (hitStop > 0 ? 0.08 : 1);

  if (fallbackAim && state === 'playing') {
    if (keys.ArrowLeft) yaw += 2.4 * rdt;
    if (keys.ArrowRight) yaw -= 2.4 * rdt;
    if (keys.ArrowUp) pitch = Math.min(1.15, pitch + 1.6 * rdt);
    if (keys.ArrowDown) pitch = Math.max(-1.25, pitch - 1.6 * rdt);
  }
  if (state === 'playing') elapsed += rdt;

  updatePlayer(dt, rdt);
  for (const e of enemies) updateEnemy(e, dt);
  updateBullets(dt);
  updateParticles(dt);
  updateChunks(dt);

  if (winTimer > 0) { winTimer -= rdt; if (winTimer <= 0 && state === 'playing') { setBulletTime(false); setState('won'); } }
  hurt = Math.max(0, hurt - rdt * 1.4);
  updateTrails(rdt);
  if (player.alive && player.hp <= 30 && state === 'playing') { heartT -= rdt; if (heartT <= 0) { heartT = 0.85; SFX.heartbeat(); } } else heartT = 0;
  shake = Math.max(0, shake - rdt * 1.8);
  hitmarkT -= rdt;
  if (muzzle.visible) { muzzle.userData.t -= rdt; if (muzzle.userData.t <= 0) muzzle.visible = false; }
}

let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state !== 'start' && state !== 'paused') simulate(rdt);
  updateCamera(rdt);
  updateAim();
  updateSun(player.pos);
  updateSky(player.pos.z);
  updateHUD();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// Initial scene behind the start screen
enemies = enemySpawns().map(createEnemy);
player.pos.set(PLAYER_SPAWN.x, PLAYER_SPAWN.y, PLAYER_SPAWN.z);
player.mesh.position.copy(player.pos);
setState('start');
updateCamera(1);
updateSun(player.pos);

// Warm-up: draw every effect once behind the start screen so shaders compile now, not on the first shot or kill.
{
  const front = camera.position.clone().addScaledVector(lookDir(), 4);
  _m.makeTranslation(front.x, front.y, front.z);
  const pools = [pBulletPool, eBulletPool, bloodPool, sparkPool, decalRings.blood.mesh, decalRings.hole.mesh];
  for (const p of pools) { p.setMatrixAt(0, _m); p.count = 1; p.instanceMatrix.needsUpdate = true; }
  const warm = [chunkMats.enemy, chunkMats.player].map((m) => { const c = new THREE.Mesh(chunkGeo, m); c.position.copy(front); c.castShadow = true; scene.add(c); return c; });
  muzzle.visible = true; muzzle.position.copy(front);
  renderer.render(scene, camera);
  for (const p of pools) p.count = 0;
  for (const c of warm) scene.remove(c);
  muzzle.visible = false;
}
updateHUD();
requestAnimationFrame(frame);

// Handle for automated tests / tinkering from the console.
window.__game = {
  player, boxes, CFG, keys, simulate, restart, updateCamera, updateAim, renderer, scene, camera,
  get enemies() { return enemies; }, L, HINTS, get state() { return state; },
  get bullets() { return bullets; }, aim,
  setView(y, p) { yaw = y; pitch = p; },
  jump() { jumpQueued = true; },
  setFiring(v) { firing = v; },
  bulletTime: setBulletTime, get timeScale() { return timeScale; }, get focus() { return focus; }, set focus(v) { focus = v; },
  noLock() { fallbackAim = true; },
  camPos: () => camera.position.clone(), frustumHas: (p) => frustum.containsPoint(p), inSolid: (p) => !!pointBox(p), get camShoulder() { return camShoulder; },
  render() { updateCamera(1 / 60); updateAim(); updateSun(player.pos); updateSky(player.pos.z); updateHUD(); renderer.render(scene, camera); },
};
})();
</script>
</body>
